name: macOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: bash macOS/build.sh "$RUNNER_TEMP/dist"
      - name: Exercise clock rendering
        run: |
          xcrun clang -fobjc-arc -framework Cocoa -framework CoreText -I macOS macOS/ClockView.m tests/macos/render.m -o "$RUNNER_TEMP/render-test"
          "$RUNNER_TEMP/render-test"
      - name: Start packaged application
        run: |
          ditto -x -k "$RUNNER_TEMP/dist/水流时钟-macOS.zip" "$RUNNER_TEMP/unpacked"
          app="$RUNNER_TEMP/unpacked/水流时钟.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/WaterClock" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 5
          kill -0 "$pid"
      - name: Drag the resize handle
        run: |
          xcrun clang -fobjc-arc -framework Cocoa -framework CoreText -I macOS macOS/ClockView.m tests/macos/resize.m -o "$RUNNER_TEMP/resize-test"
          "$RUNNER_TEMP/resize-test"
      - name: Register and remove an actual login item
        run: |
          app="/Applications/WaterflowLoginProbe.app"
          sudo mkdir "$app"
          sudo chown "$(id -u):$(id -g)" "$app"
          mkdir -p "$app/Contents/MacOS"
          cp macOS/Info.plist "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier app.waterclock.ci.login' "$app/Contents/Info.plist"
          xcrun clang -fobjc-arc -framework Cocoa -framework ServiceManagement -I macOS tests/macos/login.m -o "$app/Contents/MacOS/WaterClock"
          codesign --force --sign - "$app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          open -W -n --stdout "$RUNNER_TEMP/login.out" --stderr "$RUNNER_TEMP/login.err" "$app" --args "$RUNNER_TEMP/login-result"
          cat "$RUNNER_TEMP/login.out" "$RUNNER_TEMP/login.err"
          test "$(cat "$RUNNER_TEMP/login-result")" = 0
      - name: Verify adaptive ink and check live capture availability
        if: always()
        run: |
          xcrun clang -fobjc-arc -mmacosx-version-min=13.0 -framework Cocoa -framework CoreText -framework CoreGraphics -framework ScreenCaptureKit -I macOS macOS/ClockView.m macOS/InkSampler.m tests/macos/ink.m -o "$RUNNER_TEMP/ink-test"
          "$RUNNER_TEMP/ink-test"
      - if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: ${{ runner.temp }}/dist/水流时钟-macOS.zip
          if-no-files-found: error
