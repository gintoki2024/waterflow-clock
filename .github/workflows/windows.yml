name: Windows
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile application and smoke tests
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $flags = '/nologo', '/optimize+', '/langversion:5', '/codepage:65001', '/r:System.Drawing.dll', '/r:System.Windows.Forms.dll'
          $sources = (Get-ChildItem -LiteralPath . -Filter '*.cs' -File).FullName
          New-Item -ItemType Directory -Path dist | Out-Null
          $app = Join-Path $PWD 'dist/水流时钟.exe'
          & $csc @flags /target:winexe "/out:$app" @sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checks = Join-Path $env:RUNNER_TEMP 'ClockSmoke.exe'
          $testSource = (Get-Item -LiteralPath 'tests/windows/ClockSmoke.cs').FullName
          & $csc @flags /target:exe /main:ClockSmoke "/out:$checks" @sources $testSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $checks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -LiteralPath 'dist/水流时钟.exe' -DestinationPath 'dist/WaterflowClock-Windows.zip'
      - name: Start the extracted release executable
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'portable-clock'
          Expand-Archive -LiteralPath 'dist/WaterflowClock-Windows.zip' -DestinationPath $dir
          $exe = Join-Path $dir '水流时钟.exe'
          if ((Get-FileHash $exe).Hash -ne (Get-FileHash 'dist/水流时钟.exe').Hash) { throw 'ZIP binary differs from build' }
          $process = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru
          try {
            if (!$process.WaitForInputIdle(15000)) { throw 'Desktop message loop did not start' }
            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited -or !$process.Responding) { throw 'Packaged application failed its launch check' }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/WaterflowClock-Windows.zip
          if-no-files-found: error
